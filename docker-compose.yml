# Everything:      docker compose up --build   -> app on http://localhost:8080
# Database only:   docker compose up -d db     -> for running the backend with ./mvnw
services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: horror-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      # The root is the context because the image needs both backend/ and frontend/.
      context: .
      dockerfile: backend/Dockerfile
    container_name: horror-app
    environment:
      # Inside the Compose network the database is reachable by its service name.
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        # Wait until Postgres accepts connections, not just until its container exists.
        condition: service_healthy

volumes:
  db-data:
